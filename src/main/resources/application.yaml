server:
  port: 8083

spring:
  application:
    name: pg-ms-notifications

  datasource:
    url: ${SUPABASE_URL_NOTIFICATION}
    username: ${SUPABASE_USER}
    password: ${SUPABASE_PASSWORD}

    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      leak-detection-threshold: 30000
      pool-name: HikariPool-Notifications
      data-source-properties:
        prepareThreshold: 0
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  
  cloud:
    consul:
      host: consul
      port: 8500
      discovery:
        register: true
        health-check-path: /actuator/health
        prefer-ip-address: false
        instance-id: ${spring.application.name}
  
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      
security:
  jwt:
    secret-key: ${JWT_SECRET}
    token-expiration: 3600000
    
logging:
  level:
    com.pulse_gym: DEBUG
    org.springframework.mail: INFO

notificaciones:
  email:
    enabled: ${MAIL_ENABLED:true}
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    provider: ${WHATSAPP_PROVIDER:mock}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}

biometric:
  jwt:
    secret-key: ${BIOMETRIC_JWT_SECRET}
    
microservicio:
  usuarios:
    url: ${USUARIOS_SERVICE_URL:http://pg-ms-users:8081}
  auth:
    url: ${AUTH_SERVICE_URL:http://pg-ms-auth:8090}