server:
  port: 8083

spring:
  application:
    name: pg-ms-notifications

  datasource:
    url: ${SUPABASE_URL_NOTIFICATION}
    username: ${SUPABASE_USER}
    password: ${SUPABASE_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:

  jackson:
    time-zone: America/Bogota
  
  cloud:
    consul:
      host: consul
      port: 8500
      discovery:
        register: true
        health-check-path: /actuator/health
        prefer-ip-address: false
        instance-id: ${spring.application.name}
  
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      
security:
  jwt:
    secret-key: ${JWT_SECRET}
    token-expiration: 3600000
    
logging:
  level:
    com.pulse_gym: DEBUG
    org.springframework.mail: INFO

notificaciones:
  email:
    enabled: ${MAIL_ENABLED:true}

biometric:
  jwt:
    secret-key: ${BIOMETRIC_JWT_SECRET}
    
microservicio:
  usuarios:
    url: ${USUARIOS_SERVICE_URL:http://pg-ms-users:8081}
  auth:
    url: ${AUTH_SERVICE_URL:http://pg-ms-auth:8090}

whatsapp:
  cloud:
    enabled: ${WHATSAPP_CLOUD_ENABLED:false}
    api-url: https://graph.facebook.com/v22.0
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:pulse_gym_webhook_secret_2026}
    default-country-code: ${WHATSAPP_DEFAULT_COUNTRY_CODE:57}
    templates:
      login:
        nombre: ${WHATSAPP_TEMPLATE_LOGIN_NOMBRE:address_update}
        idioma: ${WHATSAPP_TEMPLATE_LOGIN_IDIOMA:en_US}
  provider: ${WHATSAPP_PROVIDER:cloud}
  web:
    url: ${WHATSAPP_WEB_URL:http://pg-ms-whatsapp-web:8095}